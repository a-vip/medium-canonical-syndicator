name: Medium Canonical Syndication

on:
  # schedule:
  #   - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syndicate:
    name: Syndicate Articles to Medium
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Medium Syndicator Engine
        env:
          MEDIUM_INTEGRATION_TOKEN: ${{ secrets.MEDIUM_INTEGRATION_TOKEN }}
          MEDIUM_PUBLISH_STATUS: ${{ secrets.MEDIUM_PUBLISH_STATUS }}
        run: |
          python medium_engine.py

      - name: Commit Syndication State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/medium_history.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(medium): record syndicated publication state [skip ci]"
            git push
          fi

